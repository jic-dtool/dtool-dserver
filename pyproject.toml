[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dtool-dserver"
description = "dtool storage broker for accessing datasets through dserver"
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "Lars Pastewka", email = "lars.pastewka@imtek.uni-freiburg.de"},
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "dtoolcore>=3.18.0",
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/jic-dtool/dtool-dserver"

[project.entry-points."dtool.storage_brokers"]
DServerStorageBroker = "dtool_dserver.storagebroker:DServerStorageBroker"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "dtool_dserver/version.py"

[tool.hatch.build.targets.wheel]
packages = ["dtool_dserver"]

[tool.hatch.build.targets.sdist]
exclude = [".github", ".pre-commit-config.yaml", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dtool_dserver --cov-report=term-missing"
