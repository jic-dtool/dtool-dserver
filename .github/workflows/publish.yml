name: publish

# Pushing a version tag (e.g. 0.1.0) runs the test suite, then publishes the
# release to PyPI using trusted publishing (OIDC), so no API tokens are stored
# in the repository. The upload runs in the "pypi" environment, which only
# accepts version tags and waits for a maintainer's approval.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  test:
    uses: ./.github/workflows/test.yml
    # The coverage job of test.yml requests these (it comments and stores the
    # badge only for pull requests and main, not for releases).
    permissions:
      contents: write
      pull-requests: write

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # hatch-vcs derives the version from the git tags
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12

    - name: Package distribution
      run: |
        pip install --upgrade build
        python -m build

    - name: Check version matches tag
      run: |
        ls dist/dtool_dserver-${GITHUB_REF_NAME}.tar.gz \
           dist/dtool_dserver-${GITHUB_REF_NAME}-py3-none-any.whl

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dtool-dserver
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
