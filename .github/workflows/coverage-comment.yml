name: coverage comment

# Posts the coverage comment for pull requests from forks, whose test runs
# have no permission to comment (see the coverage job in test.yml).

on:
  workflow_run:
    workflows: ["test"]
    types:
      - completed

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: write
      actions: read

    steps:
    - name: Post coverage comment
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
        MINIMUM_GREEN: 85
        MINIMUM_ORANGE: 75
