name: test

on:
  push:
    branches:
      - main
  pull_request:
  # Run by the publish workflow before a release.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]" flake8
        pip list

    - name: Lint
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test
      run: pytest -v -rfEs

    - name: Upload coverage data
      if: matrix.python-version == '3.14'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-unit
        path: .coverage
        include-hidden-files: true

  # Uploads a dataset through a running dserver into S3 using signed URLs,
  # reads and lists it through dserver, and downloads it again
  # (tests/test_e2e.py). Logs in with 'dtool dserver login' and copies
  # datasets with 'dtool cp' (tests/test_e2e_cli.py): with the OAuth2 device
  # flow, approved after a browser login at a mock OAuth2 provider, and with
  # username and password against OpenLDAP. dserver runs with a minimal
  # configuration: SQLite, MongoDB for search/retrieve,
  # dserver-signed-url-plugin, both token generator plugins, and SeaweedFS as
  # the S3 storage.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      # OAuth2/OIDC provider for the browser login: logs in every
      # authorization request as E2E_USERNAME without a login form.
      oauth2:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports:
          - 8080:8080
        env:
          JSON_CONFIG: >-
            {"interactiveLogin": false, "tokenCallbacks": [{"issuerId": "default",
            "requestMappings": [{"requestParam": "grant_type",
            "match": "authorization_code", "claims": {"sub": "testuser"}}]}]}
      # Directory for the LDAP login; ci/setup_ldap.py adds the user.
      ldap:
        image: osixia/openldap:1.5.0
        ports:
          - 389:389
        env:
          LDAP_ORGANISATION: dtool
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: admin
          LDAP_TLS: 'false'

    env:
      # S3 (SeaweedFS) credentials, also used by dserver to sign URLs.
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret12
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: dtool-test
      # dtool-s3 configuration of dserver for the test bucket.
      DTOOL_S3_ENDPOINT_dtool-test: http://localhost:9000
      DTOOL_S3_ACCESS_KEY_ID_dtool-test: admin
      DTOOL_S3_SECRET_ACCESS_KEY_dtool-test: secret12
      # Minimal dserver configuration.
      FLASK_APP: dservercore
      SECRET_KEY: e2e-secret
      SQLALCHEMY_DATABASE_URI: sqlite:////tmp/dserver-e2e/dserver.sqlite
      SEARCH_MONGO_URI: mongodb://localhost:27017/
      SEARCH_MONGO_DB: dserver
      SEARCH_MONGO_COLLECTION: datasets
      RETRIEVE_MONGO_URI: mongodb://localhost:27017/
      RETRIEVE_MONGO_DB: dserver
      RETRIEVE_MONGO_COLLECTION: datasets
      JWT_ALGORITHM: RS256
      JWT_PUBLIC_KEY_FILE: /tmp/dserver-e2e/jwt_key.pub
      JWT_PRIVATE_KEY_FILE: /tmp/dserver-e2e/jwt_key
      # OAuth2 token generator plugin with the mock provider (service
      # 'oauth2'), for the browser login and the device login of the CLI.
      OAUTH2_BASE_URL: http://localhost:5000
      OAUTH2_AUTHORIZATION_URL: http://localhost:8080/default/authorize
      OAUTH2_TOKEN_URL: http://localhost:8080/default/token
      OAUTH2_USERINFO_URL: http://localhost:8080/default/userinfo
      OAUTH2_CLIENT_ID: dserver-e2e
      OAUTH2_CLIENT_SECRET: unused
      OAUTH2_LOGIN_SUCCESS_REDIRECT: http://localhost:5000/
      OAUTH2_DEVICE_POLL_INTERVAL: '1'
      # Tokens valid for one hour: below the CLI's refresh threshold (6 h),
      # so every dtool command refreshes the stored token.
      JWT_TOKEN_EXPIRY_HOURS: '1'
      # LDAP token generator plugin with the directory of service 'ldap'.
      # Users logging in for the first time are created in dserver with
      # search and register permissions on the test base URI.
      LDAP_URI: ldap://localhost:389
      LDAP_USER_DN_TEMPLATE: uid={username},ou=people,dc=example,dc=org
      LDAP_DEFAULT_BASE_URIS: s3://dtool-test
      E2E_LDAP_ADMIN_DN: cn=admin,dc=example,dc=org
      E2E_LDAP_ADMIN_PASSWORD: admin
      E2E_LDAP_USERNAME: ldapuser
      E2E_LDAP_PASSWORD: ldap-secret
      # Test setup (ci/start_dserver.sh) and client configuration.
      E2E_WORK_DIR: /tmp/dserver-e2e
      E2E_USERNAME: testuser
      E2E_BACKEND_BASE_URI: s3://dtool-test
      DTOOL_DSERVER_E2E_BASE_URI: dserver://localhost:5000/s3/dtool-test
      DSERVER_TOKEN_FILE: /tmp/dserver-e2e/token

    steps:
    # SeaweedFS is started first so that it boots while the dependencies are
    # installed. Its S3 gateway creates an admin identity from
    # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY. The image is pinned so that a
    # CI failure means our code changed, not that SeaweedFS released a new
    # version.
    - name: Start SeaweedFS
      run: |
        docker run -d \
          --name seaweedfs \
          -p 9000:9000 \
          -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
          chrislusf/seaweedfs:4.41 \
          server -filer -s3 -s3.port=9000

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    # dtoolcore comes from PyPI: dserver-signed-url-plugin requires
    # dtoolcore>=3.20.0 for ProtoDataSet.freeze_with_manifest. The other
    # packages are installed from the default branch of their repositories:
    # the signing API of dtool-s3 is not released yet, and the released
    # dservercore does not work with current Flask.
    - name: Install dtool, dserver and plugins
      run: |
        python -m pip install --upgrade pip
        pip install \
          "dtool-s3 @ git+https://github.com/jic-dtool/dtool-s3.git" \
          "dservercore @ git+https://github.com/jic-dtool/dservercore.git" \
          "dserver-search-plugin-mongo @ git+https://github.com/jic-dtool/dserver-search-plugin-mongo.git" \
          "dserver-retrieve-plugin-mongo @ git+https://github.com/jic-dtool/dserver-retrieve-plugin-mongo.git" \
          "dserver-signed-url-plugin @ git+https://github.com/jic-dtool/dserver-signed-url-plugin.git" \
          "dserver-token-generator-plugin-oauth2 @ git+https://github.com/jic-dtool/dserver-token-generator-plugin-oauth2.git" \
          "dserver-token-generator-plugin-ldap @ git+https://github.com/jic-dtool/dserver-token-generator-plugin-ldap.git" \
          "dtool-cli>=0.7.2" dtool-create dtool-info dtool-tag dtool-annotation \
          PyJWT
        pip install -e ".[test]"
        pip list

    - name: Create bucket
      run: |
        python - <<'PYEOF'
        import os
        import time

        import boto3

        s3 = boto3.client("s3", endpoint_url="http://localhost:9000")
        bucket = os.environ["S3_BUCKET"]
        already_exists = (
            s3.exceptions.BucketAlreadyOwnedByYou,
            s3.exceptions.BucketAlreadyExists,
        )
        error = None
        for attempt in range(30):
            try:
                s3.create_bucket(Bucket=bucket)
                break
            except already_exists:
                break
            except Exception as exc:
                error = exc
                print(f"Attempt {attempt + 1}: SeaweedFS not ready yet, waiting...")
                time.sleep(2)
        else:
            raise SystemExit(f"SeaweedFS did not become ready: {error}")
        print(f"Bucket '{bucket}' is ready.")
        PYEOF

    - name: Add LDAP user
      run: python ci/setup_ldap.py

    - name: Start dserver
      run: ci/start_dserver.sh

    - name: End-to-end tests
      run: pytest -v -rfEs tests/test_e2e.py tests/test_e2e_cli.py

    - name: Upload coverage data
      if: matrix.python-version == '3.14'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-e2e
        path: .coverage
        include-hidden-files: true

    - name: dserver log
      if: always()
      run: cat /tmp/dserver-e2e/dserver.log || true

    - name: SeaweedFS log
      if: failure()
      run: docker logs seaweedfs 2>&1 | tail -100

  # Combines the coverage of the unit and end-to-end tests (including the
  # dtool commands run as subprocesses), fails below the minimum, and reports
  # it: job summary, a comment on pull requests (change against main), and a
  # badge and history on the branch python-coverage-comment-action-data.
  coverage:
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    permissions:
      # Comment on pull requests; store badge and history (pushes to main).
      pull-requests: write
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Download coverage data
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*

    - name: Combine coverage
      run: |
        pip install "coverage>=7.10"
        mv coverage-unit/.coverage .coverage.unit
        mv coverage-e2e/.coverage .coverage.e2e
        coverage combine
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        coverage report --fail-under=85

    - name: Coverage comment and badge
      id: coverage_comment
      # Not for releases (tag pushes, via the publish workflow).
      if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 85
        MINIMUM_ORANGE: 75

    # Pull requests from forks may not comment; their comment is posted by
    # the coverage-comment workflow.
    - name: Store pull request comment
      if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: python-coverage-comment-action
        path: python-coverage-comment-action.txt
